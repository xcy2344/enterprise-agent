<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智核 · 企业知识 MCP 中枢（离线演示）</title>
<style>
:root{
  --primary:#1a73e8; --primary-dark:#1558b0; --primary-soft:rgba(26,115,232,.12);
  --bg:#f5f7fb; --border:#e3e8ef; --text:#202124; --muted:#6b7280;
  --ok:#1e8e3e; --warn:#b3261e;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg)}
.app{height:100vh;display:flex;flex-direction:column}
.header{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;background:var(--primary);color:#fff;font-size:18px;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.16)}
.header .badge{font-size:12px;font-weight:400;padding:3px 10px;border-radius:11px;background:rgba(255,255,255,.22)}
.body{flex:1;display:flex;min-height:0}
.sidebar{flex:0 0 280px;width:280px;display:flex;flex-direction:column;justify-content:space-between;padding:18px;background:#fff;border-right:1px solid var(--border);overflow-y:auto}
.block{display:flex;flex-direction:column;gap:10px}
.kb-count{font-size:15px;font-weight:600}
.kb-count b{color:var(--primary)}
.btn{padding:0 16px;height:38px;border:1px solid var(--primary);border-radius:19px;background:#fff;color:var(--primary);font-size:14px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--primary-soft)}
.toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.sect{margin-top:8px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{text-align:left;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#fbfcfe;font-size:13px;line-height:1.5;color:var(--text);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--primary);background:var(--primary-soft)}
.chip .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;margin-right:6px;background:#eef2f7;color:var(--muted)}
.chip .tag.gate{background:#fdecea;color:var(--warn)}
.chip .tag.multi{background:#e8f0fe;color:var(--primary)}
.footer{padding-top:12px;border-top:1px dashed var(--border);font-size:12px;line-height:1.7;color:var(--muted)}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex}
.row-user{justify-content:flex-end}
.row-ai{justify-content:flex-start}
.wrap-ai{max-width:78%;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:100%;padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.bubble-user{background:var(--primary);color:#fff;border-bottom-right-radius:4px;max-width:68%}
.bubble-ai{background:#fff;color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
.route{font-size:11.5px;color:var(--primary);background:var(--primary-soft);padding:3px 9px;border-radius:9px;align-self:flex-start}
.trace{font-size:12px;line-height:1.7;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:10px;padding:9px 12px;font-family:Consolas,"Courier New",monospace}
.trace .pass{color:var(--ok)}
.trace .block-row{color:var(--warn)}
.empty-tip{margin-top:30px;text-align:center;font-size:13.5px;color:var(--muted);line-height:2}
.composer{flex:0 0 auto;display:flex;gap:10px;padding:12px 22px;background:#fff;border-top:1px solid var(--border)}
.input{flex:1;height:42px;padding:0 16px;border:1px solid var(--border);border-radius:21px;font-size:14.5px;outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.btn-send{height:42px;padding:0 22px;border-radius:21px;background:var(--primary);color:#fff}
.btn-send:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:40px}
.modal-mask.show{display:flex}
.modal{width:760px;max-width:100%;max-height:80vh;display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.modal-header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px}
.kb-item{padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.kb-item-text{font-size:14px;line-height:1.75;white-space:pre-wrap}
.kb-item-source{margin-top:8px;font-size:12px;color:var(--primary)}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <span>智核 · 企业知识 MCP 中枢</span>
    <span class="badge">离线演示版 · 无需后端 / 数据库 / API Key</span>
  </header>
  <div class="body">
    <aside class="sidebar">
      <div class="block">
        <div class="kb-count">知识库条目：<b id="kbTotal">12</b> 条</div>
        <button class="btn" id="btnKb">查看知识库</button>
        <label class="toggle"><input type="checkbox" id="chkTrace" checked> 显示检索详情（分数 / 阈值）</label>
      </div>
      <div class="block">
        <div class="sect">建议演示问题</div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="footer">
        RAG 企业知识问答 Agent：Planner 任务规划 · 多步任务分解 · 检索质量门控 · 多轮记忆 · 流式输出。
      </div>
    </aside>
    <main class="chat">
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input class="input" id="input" placeholder="输入你的问题，回车发送">
        <button class="btn btn-send" id="btnSend">发送</button>
      </div>
    </main>
  </div>
</div>
<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span id="modalTitle">知识库条目</span>
      <button class="btn" id="btnClose">关闭</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

  text:"公司提供五险一金、补充医疗保险、年度体检、节日福利、生日福利、团建经费等。其中五险一金按全额工资缴纳。",
  kw:["五险一金","补充医疗","体检","节日","生日","团建","福利"],
  ans:"公司提供的福利包括：\n\n五险一金、补充医疗保险、年度体检、节日福利、生日福利、团建经费。\n\n其中五险一金按全额工资缴纳。"},
 {id:10, source:"attendance.md",
  text:"考勤记录以飞书打卡为准。迟到30分钟以内算迟到，超过30分钟算旷工半天。每月累计旷工超过2天，取消当月绩效奖金。",
  kw:["旷工","绩效","打卡记录","迟到30分钟"],
  ans:"考勤以飞书打卡记录为准。\n\n· 迟到 30 分钟以内：算迟到\n· 超过 30 分钟：算旷工半天\n· 每月累计旷工超过 2 天：取消当月绩效奖金"},
 {id:11, source:"office.md",
  text:"办公用品申请在飞书审批中提交，注明名称、数量、用途。普通办公用品1个工作日内审批完成，电脑等设备3个工作日内审批完成。",
  kw:["办公用品","电脑","设备","申请流程"],
  ans:"办公用品申请在飞书审批中提交，注明名称、数量、用途。\n\n· 普通办公用品：1 个工作日内审批完成\n· 电脑等设备：3 个工作日内审批完成"}
];

var DEMO_QUESTIONS = [
 {tag:"", cls:"", q:"年假怎么申请？"},
 {tag:"", cls:"", q:"报销流程是什么？"},
 {tag:"", cls:"", q:"出差住宿标准是多少？"},
 {tag:"阈值拦截", cls:"gate", q:"今天天气怎么样？"},
 {tag:"多步分解", cls:"multi", q:"帮我对比年假和调休的区别，然后告诉我休5天需要提前几天申请"}
];

var NOT_FOUND = "未找到与您问题直接相关的内容，建议您换一种问法或咨询相关部门。";

function baselineScore(q){
  var h = 0;
  for (var i = 0; i < q.length; i++) h = (h * 31 + q.charCodeAt(i)) >>> 0;
  return 0.19 + (h % 20) / 100;
}

function retrieve(q){
  var ql = q.toLowerCase();
  var base = baselineScore(ql);
  var out = [];
  for (var i = 0; i < KB.length; i++){
    var e = KB[i], n = 0;
    for (var j = 0; j < e.kw.length; j++){
      if (ql.indexOf(e.kw[j].toLowerCase()) >= 0) n++;
    }
    var score = n > 0 ? Math.min(0.58 + n * 0.06, 0.82) : base;
    out.push({entry:e, hits:n, score:score});
  }
  out.sort(function(a,b){ return b.score - a.score; });
  return out;
}

function isMulti(q){
  return /对比|然后|以及|分别|区别|并且/.test(q);
}

function splitMulti(q){
  var segs = q.split(/然后|接着|以及|还有|并且/);
  var parts = [];
  for (var i = 0; i < segs.length; i++){
    var s = segs[i].replace(/^[\s，,、。]+|[\s，,、。]+$/g, "");
    if (s.length < 2) continue;
    var m = s.match(/对比(.+?)和(.+?)的?(区别|差异)/);
    if (m){ parts.push(m[1].trim()); parts.push(m[2].trim()); }
    else parts.push(s);
  }
  return parts;
}

var messagesEl = document.getElementById("messages");
var inputEl = document.getElementById("input");
var btnSend = document.getElementById("btnSend");
var chkTrace = document.getElementById("chkTrace");
var busy = false;

function scrollBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

function addUser(text){
  var row = document.createElement("div");
  row.className = "row row-user";
  var b = document.createElement("div");
  b.className = "bubble bubble-user";
  b.textContent = text;
  row.appendChild(b);
  messagesEl.appendChild(row);
  scrollBottom();
}

function addAssistantShell(routeText){
  var row = document.createElement("div");
  row.className = "row row-ai";
  var wrap = document.createElement("div");
  wrap.className = "wrap-ai";
  if (routeText){
    var r = document.createElement("div");
    r.className = "route";
    r.textContent = routeText;
    wrap.appendChild(r);
  }
  var b = document.createElement("div");
  b.className = "bubble bubble-ai";
  wrap.appendChild(b);
  row.appendChild(wrap);
  messagesEl.appendChild(row);
  scrollBottom();
  return { wrap: wrap, bubble: b };
}

function addTrace(wrap, lines){
  if (!chkTrace.checked) return;
  var t = document.createElement("div");
  t.className = "trace";
  for (var i = 0; i < lines.length; i++){
    var d = document.createElement("div");
    d.className = lines[i].cls || "";
    d.textContent = lines[i].text;
    t.appendChild(d);
  }
  wrap.appendChild(t);
  scrollBottom();
}

function typeOut(bubble, text, done){
  var i = 0;
  var timer = setInterval(function(){
    i += 2;
    bubble.textContent = text.slice(0, i);
    scrollBottom();
    if (i >= text.length){
      clearInterval(timer);
      bubble.textContent = text;
      if (done) done();
    }
  }, 12);
}

function answerFor(q){
  var res = retrieve(q);
  var top = res[0];
  if (top.score < THRESHOLD){
    return {
      route: "路径：向量检索 → 检索质量门控（拦截）",
      text: NOT_FOUND,
      trace: [
        {text: "检索最高相似度 " + top.score.toFixed(2) + " < 阈值 " + THRESHOLD.toFixed(2), cls: "block-row"},
        {text: "判定：知识库外问题 → 直接拒答，未调用大模型（0 Token）"}
      ]
    };
  }
  var used = [];
  for (var i = 0; i < res.length; i++){
    if (res[i].score >= THRESHOLD && res[i].hits > 0) used.push(res[i]);
  }
  var srcs = [];
  for (var k = 0; k < used.length; k++) srcs.push(used[k].entry.source);
  return {
    route: "路径：向量检索 → 阈值通过 → 大模型生成",
    text: used[0].entry.ans,
    trace: [
      {text: "检索最高相似度 " + top.score.toFixed(2) + " ≥ 阈值 " + THRESHOLD.toFixed(2), cls: "pass"},
      {text: "命中切片：" + srcs.join(" / ")},
      {text: "判定：知识库内问题 → 调用大模型生成回答"}
    ]
  };
}

function multiAnswer(q){
  var parts = splitMulti(q);
  var lines = [], trace = [], srcs = [];
  for (var i = 0; i < parts.length; i++){
    var sub = parts[i];
    var res = retrieve(sub);
    var top = res[0];
    var label = "子任务 " + (i + 1) + "：" + sub;
    if (top.score < THRESHOLD){
      lines.push("【" + label + "】\n知识库中未收录该内容，如实说明，不做推测。");
      trace.push({text: label + " → 最高分 " + top.score.toFixed(2) + " < " + THRESHOLD.toFixed(2) + "，未命中", cls: "block-row"});
    } else {
      lines.push("【" + label + "】\n" + top.entry.ans);
      trace.push({text: label + " → 命中 " + top.entry.source + "（" + top.score.toFixed(2) + "）", cls: "pass"});
      srcs.push(top.entry.source);
    }
  }
  return {
    route: "路径：Planner → 多步任务分解（" + parts.length + " 个子任务）→ 逐个检索 → 汇总",
    text: lines.join("\n\n————\n\n"),
    trace: trace.concat([{text: "汇总约束：只依据子任务结果汇总；子任务未提及的内容如实说明，不用通用知识补充"}])
  };
}

function send(){
  var q = inputEl.value.trim();
  if (!q || busy) return;
  busy = true;
  btnSend.disabled = true;
  inputEl.value = "";
  addUser(q);
  var multi = isMulti(q);
  var res = multi ? multiAnswer(q) : answerFor(q);
  var shell = addAssistantShell(res.route);
  typeOut(shell.bubble, res.text, function(){
    addTrace(shell.wrap, res.trace);
    busy = false;
    btnSend.disabled = false;
    inputEl.focus();
  });
}

function init(){
  document.getElementById("kbTotal").textContent = KB.length;

  var chips = document.getElementById("chips");
  for (var i = 0; i < DEMO_QUESTIONS.length; i++){
    (function(item){
      var c = document.createElement("button");
      c.className = "chip";
      var tag = item.tag ? '<span class="tag ' + item.cls + '">' + item.tag + '</span>' : "";
      c.innerHTML = tag + item.q;
      c.onclick = function(){ inputEl.value = item.q; send(); };
      chips.appendChild(c);
    })(DEMO_QUESTIONS[i]);
  }

  var mb = document.getElementById("modalBody");
  for (var k = 0; k < KB.length; k++){
    var d = document.createElement("div");
    d.className = "kb-item";
    var t = document.createElement("div");
    t.className = "kb-item-text";
    t.textContent = KB[k].text;
    var s = document.createElement("div");
    s.className = "kb-item-source";
    s.textContent = "来源：" + KB[k].source;
    d.appendChild(t); d.appendChild(s);
    mb.appendChild(d);
  }

  document.getElementById("modalTitle").textContent = "知识库条目（共 " + KB.length + " 条）";
  document.getElementById("btnKb").onclick = function(){ document.getElementById("modal").classList.add("show"); };
  document.getElementById("btnClose").onclick = function(){ document.getElementById("modal").classList.remove("show"); };
  document.getElementById("modal").onclick = function(e){ if (e.target.id === "modal") e.target.classList.remove("show"); };

  btnSend.onclick = send;
  inputEl.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.isComposing) send();
  });

  var tip = document.createElement("div");
  tip.className = "empty-tip";
  tip.innerHTML = "智核 · 企业知识问答演示<br>点左侧「建议演示问题」，或直接输入问题";
  messagesEl.appendChild(tip);
  inputEl.focus();
}

init();
</script>
</body>
</html>
